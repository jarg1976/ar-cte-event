<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>MindAR + A-Frame com GLTF Animado</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

  <!-- MindAR para A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #info {
      position: absolute;
      left: 10px;
      top: 10px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 6px 10px;
      font-family: sans-serif;
      z-index: 5;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div id="info">Aponta a câmara ao marcador configurado no MindAR</div>

  <!-- Cena MindAR -->
  <a-scene mindar-image="imageTargetSrc: targets.mind;" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Anchor para o marcador -->
    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Modelo GLTF com animações -->
      <a-entity gltf-model="url(MascoteCTE.glb)" animation-mixer scale="0.25 0.25 0.25" position="0 0 0"></a-entity>
    </a-entity>
  </a-scene>
</body>

</html>
