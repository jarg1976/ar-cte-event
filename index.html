
<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <title>AR Cubo Exemplo</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.2.1/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene embedded arjs='trackingMethod: best; sourceType: webcam;'>

    <!-- Marker personalizado -->
    <a-marker type='pattern' url='pattern-marker.patt' id="marker">

      <!-- Cubo 3D que aparece sobre o marker -->
      <a-box position="0 0.5 0" rotation="0 45 0" color="#4CC3D9" depth="0.5" height="0.5" width="0.5">
      </a-box>

    </a-marker>

    <!-- Camera do utilizador -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const marker = document.querySelector('#marker');

    marker.addEventListener('markerFound', () => {
      console.log("Marker detectado! Cubo visível.");
    });

    marker.addEventListener('markerLost', () => {
      console.log("Marker perdido!");
    });
  </script>

</body>

</html>
