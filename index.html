<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Teste AR.js (compatível)</title>

  <!-- AFRAME 1.0.4 (compatível com AR.js 2.2.1) -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

  <!-- AR.js (aframe build) -->
  <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.2.1/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: true;">
    <a-marker type="pattern" url="marker.patt" id="marker">
      <a-box position="0 0.5 0" color="#4CC3D9"></a-box>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // espera pela cena A-Frame estar carregada
    document.querySelector('#scene').addEventListener('loaded', () => {
      console.log('a-scene loaded — agora é seguro aceder aos elementos');
      const marker = document.querySelector('#marker');
      marker.addEventListener('markerFound', () => console.log('markerFound'));
      marker.addEventListener('markerLost', () => console.log('markerLost'));
    });
  </script>
</body>

</html>
