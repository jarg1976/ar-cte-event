<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Teste Marker</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.2.1/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: true;">
    <a-marker type="pattern" url="marker.patt" id="marker">
      <a-box position="0 0.5 0" color="#4CC3D9"></a-box>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.querySelector('#marker').addEventListener('markerFound', () => console.log('markerFound'));
    document.querySelector('#marker').addEventListener('markerLost', () => console.log('markerLost'));
  </script>
</body>

</html>
